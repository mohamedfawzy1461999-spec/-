<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الحضور والانصراف</title>
<style>
    body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
    button { font-size: 20px; padding: 15px 30px; margin: 10px; cursor: pointer; border-radius: 8px; border: none; color: white; }
    .clock-in { background-color: #28a745; }
    .clock-out { background-color: #dc3545; }
    #status { margin-top: 30px; font-size: 22px; font-weight: bold; color: #333; }
</style>
</head>
<body>

<h1>موقع إدارة الحضور والانصراف</h1>
<button class="clock-in" onclick="logAction('تم تسجيل الحضور')">تسجيل الحضور</button>
<button class="clock-out" onclick="logAction('تم تسجيل الانصراف')">تسجيل الانصراف</button>

<div id="status"></div>

<script>
function logAction(action) {
    const time = new Date().toLocaleTimeString('ar-EG');
    document.getElementById('status').innerText = action + ' بنجاح في الساعة ' + time;
}
</script>

</body>
</html>
