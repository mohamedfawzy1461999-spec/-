<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الحضور والانصراف</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        h1 { color: #333; font-size: 1.5rem; margin-bottom: 1.5rem; }
        .btn { display: block; width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; color: white; transition: opacity 0.2s; }
        .btn-in { background-color: #28a745; }
        .btn-out { background-color: #dc3545; }
        .btn:hover { opacity: 0.9; }
        #status { margin-top: 1rem; font-weight: bold; color: #555; }
    </style>
</head>
<body>

<div class="card">
    <h1>نظام البصمة الذكي</h1>
    <button class="btn btn-in" onclick="logAction('تم تسجيل الحضور')">تسجيل الحضور</button>
    <button class="btn btn-out" onclick="logAction('تم تسجيل الانصراف')">تسجيل الانصراف</button>
    <div id="status">مستعد للتحقق</div>
</div>

<script>
    function logAction(action) {
        const time = new Date().toLocaleTimeString('ar-EG');
        document.getElementById('status').innerText = `${action} الساعة ${time}`;
        console.log(`${action} at ${time}`);
    }
</script>

</body>
</html>
